[theme]
base = "light"
primaryColor = "#7A5240"
backgroundColor = "#FFFAF4"
secondaryBackgroundColor = "#F6EEE5"
textColor = "#3A261C"
linkColor = "#7A5240"
borderColor = "#E3D3C2"
showWidgetBorder = true
baseRadius = "12px"
buttonRadius = "20px"
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap, serif"
codeFont = "DM Mono:https://fonts.googleapis.com/css2?family=DM+Mono&display=swap, monospace"
metricValueFontWeight = 500
dataframeHeaderBackgroundColor = "#F6EEE5"
chartCategoricalColors = ["#7A5240", "#C9677E", "#C9A68C", "#E8B04B"]

[theme.sidebar]
backgroundColor = "#F6EEE5"
secondaryBackgroundColor = "#FFFAF4"

[client]
toolbarMode = "minimal"
